nombre: las_lagunas_potrerillos_2024
descripcion: 'Complejo Las Lagunas–Potrerillos (partes SNMF ''LAS LAGUNAS'' y ''POTRERILLOS'' del 18-09-2024, unidos por el evento satelital 2024-003),
  18-09-2024 → 09-10-2024 (extinguido). Cicatriz COE de 38.631 ha (un polígono de 38.541 ha + parches), 100 % dentro del dominio: es el incendio
  que motivó el dominio Las Lagunas–Potrerillos. Caso SM05 de conjunto_pruebas (tipo estrés) adaptado al estándar 7.1. Hay 2.006 focos VIIRS S-NPP:
  el primer pase (18-09 15:43 local) ya muestra 50 focos a lo largo de 9 km, por lo que la ignición base es múltiple (los focos del primer pase)
  y t0 es la hora de ese pase.'
fechas:
  inicio: '2024-09-18'
  fin: '2024-10-09'
  origen: parte SNMF (fecha_inicio, fecha_extincion)
fuentes:
  perimetro: COE San Luis (AQ2024_0001, AQ2024_0076)
  ignicion: focos VIIRS S-NPP del primer pase dentro de la cicatriz
  meteo: ERA5 (ECMWF/C3S) vía Open-Meteo Historical Weather API, models=era5, celda (-32.5, -65.5), descargado 2026-10-07; punto = centroide de
    la cicatriz (-32.6175, -65.5753)
  combustible: MapBiomas Col.3 2023 + NDVI/NDMI verano 2024 (regla 3.3)
  indices_mes: NDVI/NDMI 2024-09 (compuesto mensual S2)
  focos: FIRMS VIIRS S-NPP (archivo local del proyecto)
