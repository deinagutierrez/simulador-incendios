nombre: las_lagunas_la_aguada_2023
descripcion: 'Incendio ''Las Lagunas y La Aguada'' (parte SNMF, Libertador General San Martín), 31-08-2023 → 01-09-2023 (extinguido). Cicatriz
  COE de 105,4 ha, 100 % dentro del dominio Las Lagunas–Potrerillos. Caso SM01 de conjunto_pruebas adaptado al estándar 7.1. La hora de ignición
  es supuesta (12:00 local): no hay focos VIIRS sobre esta cicatriz.'
fechas:
  inicio: '2023-08-31'
  fin: '2023-09-01'
  origen: parte SNMF (fecha_inicio, fecha_extincion)
fuentes:
  perimetro: COE San Luis (AQ2023_0060)
  ignicion: parte SNMF proyectado al borde de la cicatriz
  meteo: ERA5 (ECMWF/C3S) vía Open-Meteo Historical Weather API, models=era5, celda (-32.5, -65.75), descargado 2026-10-07; punto = centroide
    de la cicatriz (-32.5911, -65.6285)
  combustible: MapBiomas Col.3 2022 + NDVI/NDMI verano 2023 (regla 3.3)
  indices_mes: NDVI/NDMI 2023-08 (compuesto mensual S2)
  focos: FIRMS VIIRS S-NPP (archivo local del proyecto)
escenario:
  nombre: las_lagunas_la_aguada_2023
  grilla:
    xmin: 3529230.0
    ymin: 6388890.0
    xmax: 3540540.0
    ymax: 6400170.0
  t_inicio: '2023-08-31T12:00:00-03:00'
  duracion_h: 36
  dt_min: 2.0
  vecindad: 8
  modo: determinista
  semilla: 42
  ignicion: ignicion.geojson
  meteo: meteo_horaria.csv
  combustible: combustible_pre_evento.tif
  indices_mes_evento: indices_mes_evento.tif
  ndvi_verano: ndvi_verano_previo.tif
  perimetro_observado: perimetro_observado.geojson
  focos: focos_viirs.geojson
  salidas:
