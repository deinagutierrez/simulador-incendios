  - fuente: "HIPÓTESIS derivada: extremo E de la cicatriz (alargada E-O, 6 km), a barlovento del viento E del 17/10. No es una observación."
    puntos:
      - {nombre: extremo E cicatriz (hipótesis), lon: -65.74991, lat: -32.62445}
  - fuente: "Punto SNMF del parte 'LAS CHACRAS' (Coronel Pringles según el parte; inicio 19/10, controlado y extinguido 23/10), a 1,05 km al E del polígono. El parte es posterior a los primeros focos (17/10): referencia administrativa de la reactivación. Si no es combustible se desplaza a la celda quemada más cercana (HIPÓTESIS)."
    puntos:
      - {nombre: Las Chacras (SNMF 19/10), lon: -65.741472, lat: -32.640056}
  - fuente: "HIPÓTESIS derivada: PUNTO ÚNICO de ignición elegido con v3.1 libre_v2 (2026-11-04, resultados/v3.1/paso2_hora_x49/barrido_punto_unico_chacrasoct.csv): entre los 40 candidatos de grilla sobre la cicatriz y los 4 focos del primer pase por separado, a las 06 y 13 UTC, es el de mejor puntaje (0,464; IoU 0,53; 40 % de primeras detecciones a tiempo) frente a 0,430 de los 4 focos juntos y 0,452 del mejor foco solo (n04). Barrido de hora con este punto: 04 UTC 0,465 y 06 UTC 0,464 (meseta), 08 UTC 0,417, 13 UTC 0,255. Hipótesis de trabajo: los 4 focos del primer pase son el fuego ya desarrollado, no el origen; el origen es anterior y único. No es una observación. Queda a 400 m al E del foco n02 y a 1,1 km al E del n04."
    puntos:
      - {nombre: punto único v3.1 librev2 (hipótesis), lon: -65.75638, lat: -32.6557}
  - fuente: "HIPÓTESIS derivada: PUNTO ÚNICO de ignición elegido con v4.0 modelo_v3 libre, sin parada en cicatriz (2026-11-04, resultados/v4.0/busqueda_punto_x49/barrido_punto_unico_chacrasoct_v40.csv, misma métrica de v3.1): entre los mismos 44 candidatos a las 06 y 13 UTC, el mejor es el foco n04 del primer pase (puntaje 0,374; IoU 0,55; 20 % a tiempo); barrido de hora con v4.0: 06 UTC 0,374, 04 UTC 0,343, 08 UTC 0,332, 13 UTC 0,188. Los dos motores coinciden en la hora (06 UTC) y eligen puntos a 1,3 km uno del otro (alt3 el de v3.1, alt4 el de v4.0). No es una observación."
    puntos:
      - {nombre: "punto único v4.0 = foco n04 (hipótesis)", lon: -65.767908, lat: -32.650586}
