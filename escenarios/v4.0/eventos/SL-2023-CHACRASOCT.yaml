notas:
  - "Evento no visto por v3.x ni por los lotes de v4 (E033 a E059). M1 y M2 lo corrieron una sola vez en la Fase 1 del banco (E023, X-11). docs/v4.0/06 y 02 lo dejaron como 'exploratorio' por la discrepancia de superficie del compilador."
  - "El mayor de los cinco eventos nuevos (1.308 ha) y el mejor observado: 7 pases con focos (46 detecciones S-NPP; sin NOAA-20 local) y combate documentado. Sirve para forma, tiempo y, más adelante, contención."
  - "Secuencia meteorológica (IFS): 16/10 viento S 8 m/s y HR 16 % (sin focos); 17/10 E 3 m/s, HR 23 %; 18/10 lluvia 7,8 mm y calma (2 focos nocturnos); 19/10 HR 26 %, calmo (reactivación, 27 focos); 20-21/10 N 4 m/s, 27-29 °C. Prueba de la recuperación de la humedad del combustible muerto tras lluvia (limitación 3 de la Etapa 9)."
  - "Topónimos: Laguna Larga 4,1 km, La Totora 5,3 km. Celda F08-C08 de la grilla de 10 km; 4,4 km del borde del dominio."
