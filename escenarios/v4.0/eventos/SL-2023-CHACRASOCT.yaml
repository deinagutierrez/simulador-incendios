# Incendio Las Chacras, al O de Potrerillos (Libertador General San Martín; el parte SNMF dice Coronel Pringles), octubre de 2023. Evento NO VISTO (lote X-49, incorporado 2026-11-04).
# Es el polígono 2023_26601 que docs/v4.0/06 descartó por '73 ha vs 1.336 ha': las 72,7 ha son el dNBR del compilador, no una cifra del SNMF; 46 detecciones VIIRS en 7 pases cubren todo el polígono. Componente del banco V4: MB_2023_26601_2023-10.
id: SL-2023-CHACRASOCT
nombre: Las Chacras - O de Potrerillos (Libertador General San Martín), octubre 2023 (MapBiomas 2023_26601)
dominio: las_lagunas_potrerillos
referencia_espacial:
  fuente: MapBiomas Fuego Col. 1 polígono 2023_26601 restringido a los píxeles quemados en OCTUBRE de 2023 (raster mensual; 28 ha de junio a noviembre excluidas). Componente MB_2023_26601_2023-10 de eventos_fase1.csv (banco V4).
  oid: "2023_26601"
  calendar_year: 2023
  mes: 10
  superficie_ha: 1308
  superficie_ha_sat_compilador: 72.7   # dNBR 'anclado en focos VIIRS' del compilador del archivo SNMF: inconsistente con MapBiomas y con los focos
inicio:
  fecha_local: "2023-10-17"       # VIIRS S-NPP: 4 detecciones el 17/10 a las 17:22 UTC (FRP máx 92 MW, centro-S de la cicatriz) y 11 a las 19:02 UTC; SNMF registra inicio 19/10 (primer reporte 20/10), que es la reactivación tras la lluvia del 18/10
  hora_utc_hipotesis: ["2023-10-17T15:00:00Z", "2023-10-17T13:00:00Z", "2023-10-17T17:00:00Z", "2023-10-17T11:00:00Z", "2023-10-17T06:00:00Z"]   # HIPÓTESIS 12, 10, 14 y 8 h local del 17/10 (24 °C, HR 23 %, viento E 3,4 m/s, máx 6,4)
  # hipótesis 4 (2026-11-04, barrido de hora de v3.1 según docs/v3.1/02, resultados/v3.1/paso2_hora_x49): 03 h local del 17/10, la de mejor puntaje (0,430; IoU 0,49, 37 % de primeras detecciones a tiempo)
  # entre las horas cada 2 h de la ventana [pase nocturno S-NPP sin focos ~05 UTC, primer pase 17:22 UTC]. La hipótesis 1 (13 UTC) casi empata (0,422; IoU 0,41, 43 % a tiempo, error mediano 0 h).
  cota_superior_utc: "2023-10-17T17:22:00Z"
  confianza: media                # día fijado por VIIRS; hora desconocida; el SNMF da una fecha posterior
fin:
  fecha_extincion_snmf: "2023-10-23"
  fecha_contenido_snmf: "2023-10-23"   # estado 'Controlado' el 23/10 (no hay 'Contenido'); 'Extinguido' el 24/10 con fecha_extincion 23/10
  propagacion_principal: "2023-10-17 a 2023-10-19"   # VIIRS: 17/10 (4 + 11), 18/10 (2, lluvia 7,8 mm), 19/10 (10 + 5 nocturnos y 12 a las 18:25 UTC = T80 del banco), 20/10 (2)
  fin_simulacion_utc: "2023-10-23T03:00:00Z"   # fin del 22/10 local: fin de la serie IFS del banco (la extinción SNMF, 23/10, queda un día después)
  evaluacion_utc: ["2023-10-18T03:00:00Z", "2023-10-20T03:00:00Z", "2023-10-21T03:00:00Z", "2023-10-23T03:00:00Z"]   # fin del 17/10, fin del 19/10 (T80), fin del 20/10 (último pase), fin de la simulación (controlado)
ignicion:
  fuente: "Primer pase VIIRS S-NPP, 17/10/2023 17:22 UTC: las 4 detecciones (regla §4.1 del banco, docs/v4.0/16); la misma ignición de la Fase 1 (_banco/MB_2023_26601_2023-10/ignicion.geojson). El punto SNMF (19/10) queda a 1,05 km al E del polígono (alt2)."
  puntos:
    - {nombre: VIIRS 17/10 17:22 n01, lon: -65.77206, lat: -32.6567}
    - {nombre: VIIRS 17/10 17:22 n02, lon: -65.76725, lat: -32.65643}
    - {nombre: VIIRS 17/10 17:22 n03, lon: -65.77269, lat: -32.6508}
    - {nombre: VIIRS 17/10 17:22 n04, lon: -65.768, lat: -32.65054}
ignicion_alternativas:
