# Antes (E033, variante local y viento WindNinja): 121,41 ha (prueba_rapida_v4_20261027-1132, en resultados/v4.0/_archivo_mitigacion/).
# La parada anticipada está apagada para que la prueba de humo ejercite siempre las 6 h (propagación y barreras).
descripcion: Prueba de humo de v4. Si corre, SIM y los insumos derivados de la ficha de v3.0 están bien instalados.
evento: SL-2024-LASLAGUNAS
hipotesis: 1
horas: 6
variante: barreras           # modelo_v3 + caminos como barrera (cruce según la llama y el ancho de la vía), sin combate
ajustes:
