      - {nombre: extremo norte cicatriz sept (hipótesis), lon: -65.51652, lat: -32.72047}
  - fuente: "HIPÓTESIS derivada por búsqueda inversa (2026-10-27): punto que maximiza el IoU con la cicatriz en el instante en que la simulación alcanza su superficie (variante libre_v2, ~40 candidatos sobre la cicatriz principal + 300 m y refinamiento; estable en las 3 hipótesis horarias salvo h2 (10 h del 07/09), donde todos los candidatos caen a < 0,2). IoU 0,59 vs 0,06 del punto SNMF; alt0 0,46. Se ajusta a la misma cicatriz con la que se evalúa: no es una observación ni una validación independiente."
    puntos:
      - {nombre: búsqueda inversa (hipótesis), lon: -65.52092, lat: -32.73045}
