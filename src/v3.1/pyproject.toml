[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incendios-sl"
version = "3.1.0"
description = "Simulador de propagación de incendios forestales para San Luis (autómata celular 30 m)"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0", "scipy>=1.14", "numba>=0.60", "pandas>=2.2", "pyarrow>=15",
  "rasterio>=1.4", "geopandas>=1.0", "shapely>=2.0", "pyproj>=3.6",
  "xarray>=2024.1", "netCDF4>=1.6", "pyyaml>=6", "requests>=2.31", "psutil>=5.9",
  "earthengine-api>=1.0", "fastapi>=0.110", "uvicorn>=0.29", "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["../../test/v3.1"]
markers = ["integration: requiere red, GEE o WindNinja"]
