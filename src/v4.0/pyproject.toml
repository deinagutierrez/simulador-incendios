[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incendios-sl"
version = "4.0.0"
description = "Simulador de propagación de incendios forestales para San Luis (autómata celular 30 m, SIM de V.4 integrado)"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0", "scipy>=1.13", "pandas>=2.2", "rasterio>=1.4", "geopandas>=1.0", "pyogrio>=0.9",
  "shapely>=2.0", "pyproj>=3.6", "affine>=2.4", "matplotlib>=3.8", "imageio>=2.34", "pyyaml>=6",
]

[project.optional-dependencies]
test = ["pytest>=8"]
banco = ["tabulate>=0.9", "earthengine-api>=1.0", "requests>=2.31"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["../../test/v4.0"]
markers = ["integration: requiere red, GEE o WindNinja"]
